name: Refresh India-hiring company list

on:
  schedule:
    - cron: "30 20 * * 0"   # Mondays 02:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe ~14k Greenhouse/Lever/Ashby boards for India openings
        run: python tools/discover_ats.py
      - name: Commit updated list (also keeps the repo "active" for scheduled workflows)
        run: |
          git config user.name  "jobpilot-bot"
          git config user.email "jobpilot-bot@users.noreply.github.com"
          git add data/ats_companies.csv
          git diff --cached --quiet || git commit -m "Refresh India-hiring company list"
          git push
