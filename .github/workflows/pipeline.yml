name: JobPilot Pipeline

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay a few minutes under load)
  workflow_dispatch:

# Never two runs at once (a MongoDB run-lock in scheduler.py also guards against a laptop run).
concurrency:
  group: jobpilot-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  actions: write          # for the keep-alive step below

jobs:
  run-pipeline:
    runs-on: ubuntu-22.04   # 24.04's newer OpenSSL has had TLS handshake issues with some Atlas clusters
    timeout-minutes: 25
    env:
      TZ: Asia/Kolkata
      MONGODB_URI:          ${{ secrets.MONGODB_URI }}
      GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY:      ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY:       ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GMAIL_ADDRESS:        ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_EMAIL:         ${{ secrets.NOTIFY_EMAIL }}
      TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline once
        run: python -c "from scheduler import run_pipeline; run_pipeline()"

      # GitHub silently disables scheduled workflows after 60 days without repo activity
      # (this is exactly how the previous pipeline died). Re-enabling via the API resets that.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable" || true
